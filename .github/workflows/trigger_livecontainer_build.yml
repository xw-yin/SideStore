name: Trigger LiveContainer Build

on:
  push:
    branches:
      - feat/sidesign-migration
      - develop
      - main

jobs:
  trigger-livecontainer:
    name: Trigger LiveContainer Build
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch event to LiveContainer
        run: |
          TOKEN="${{ secrets.LC_TRIGGER_TOKEN || secrets.PERSONAL_ACCESS_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/xw-yin/LiveContainer/dispatches \
              -d "{\"event_type\":\"sidestore_updated\",\"client_payload\":{\"sidestore_revision\":\"${{ github.sha }}\"}}" \
              || echo "Optional dispatch trigger completed."
          else
            echo "Secret LC_TRIGGER_TOKEN not set; skipping cross-repo dispatch."
          fi
